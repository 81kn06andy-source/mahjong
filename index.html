function newMatch(){if(S.phase!=='over')return;S.score=[0,0,0,0];S.rw=0;S.rc=0;S.dealer=0;S.streak=0;start()}
function inviteText(){return `🀄 瘋狂動物麻將樂園！來打麻將～\n房號：${room}\n\n點這個網址直接進這一桌：\n${location.origin+location.pathname}?room=${room}\n\n（或打開遊戲後，在開始畫面「房號」輸入 ${room}）`}
function invMsg(t){let e=$('#invT');if(!e){e=document.createElement('div');e.id='invT';e.className='invt';document.body.append(e)}e.textContent=t;e.hidden=false;clearTimeout(G.invTm);G.invTm=setTimeout(()=>e.hidden=true,2600)}
function invBox(t){let e=$('#invB');if(!e){e=document.createElement('div');e.id='invB';e.className='invb';e.innerHTML='<div><b>長按或全選複製這段文字</b><textarea readonly></textarea><button type="button" onclick="this.closest(\'.invb\').hidden=true">關閉</button></div>';document.body.append(e)}e.querySelector('textarea').value=t;e.hidden=false;const ta=e.querySelector('textarea');ta.focus();ta.select()}
function copyInvite(){const t=inviteText(),ok=()=>invMsg('✅ 已複製邀請，貼到 LINE 給朋友吧！');
 const legacy=()=>{try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(ta);ta.select();ta.setSelectionRange(0,t.length);const r=document.execCommand('copy');ta.remove();if(r)ok();else invBox(t)}catch(_){invBox(t)}};
 try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,legacy);else legacy()}catch(_){legacy()}}
function ovPinch(){const h=$('#ovH');if(!h||h.dataset.pz)return;h.dataset.pz=1;let p=null;const D=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1,set=z=>{G.ovz=Math.max(.6,Math.min(2.2,z));h.style.setProperty('--ovz',G.ovz)};
 h.addEventListener('touchstart',e=>{if(e.touches.length===2){p={d0:D(e.touches),z0:G.ovz||1};e.preventDefault()}},{passive:false});
 h.addEventListener('touchmove',e=>{if(p&&e.touches.length===2){set(p.z0*D(e.touches)/p.d0);e.preventDefault()}},{passive:false});
 h.addEventListener('touchend',e=>{if(e.touches.length<2)p=null});
 h.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();set((G.ovz||1)*(1-e.deltaY*.01))},{passive:false})}
function npOff(s){if(G.npGid!==S.gid){G.npGid=S.gid;G.npOff={}}return !!G.npOff[s]}
function npToggle(s){npOff(s);G.npOff[s]=!G.npOff[s];render()}
function peek(){G.peek=1;render()}
(async()=>{init3d();try{db=await claude.use('db')}catch(e){db=null}
 if(!db){$('#app').innerHTML='<div style="padding:24px;font-size:16px;line-height:1.7"><b>還沒設定好連線</b><br>請把 Firebase 的設定貼到 firebase-config.js（照說明文件第 1 部分）。</div>';return}
 drawProf();{let u='';try{u=(new URLSearchParams(location.search).get('room')||'').replace(/[^A-Za-z0-9]/g,'').slice(0,16)}catch(_){}$('#room').value=u||defRoom();if(!u){G.hallAuto=1;hallShow(1)}}join()})();
</script></body></html>
