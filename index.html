function sfxLoad(){if(!actx||G.sfxL)return;G.sfxL=1;[['push',SFX_PUSH],['out',SFX_OUT],['dice',SFX_DICE]].forEach(([k,b64])=>{try{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ok=b=>{SBUF[k]=b},r=actx.decodeAudioData(u.buffer,ok,()=>{});if(r&&r.then)r.then(ok).catch(()=>{})}catch(_){}})}
function playSample(bf,ms,dur,vol,fade=.5){try{const t=actx.currentTime+ms/1000,s=actx.createBufferSource(),g=actx.createGain();s.buffer=bf;const d=Math.min(dur,bf.duration);g.gain.setValueAtTime(vol,t);g.gain.setValueAtTime(vol,t+Math.max(0,d-fade));g.gain.linearRampToValueAtTime(0,t+d);s.connect(g).connect(sfxOut());s.start(t,0,d)}catch(_){}}

function clatter(D,o){const sr=actx.sampleRate,n=Math.max(1,Math.floor(D*sr)),bf=actx.createBuffer(2,n,sr),L=bf.getChannelData(0),R=bf.getChannelData(1),env=o.env||(()=>1),T=[];
 if(o.times)o.times.forEach(t=>T.push([t,1]));else{let t=0;for(;;){const e=Math.max(.04,env(t/D));t+=-Math.log(1-Math.random())/(o.dens*e);if(t>=D)break;T.push([t,env(t/D)])}}
 for(const[t,e]of T){const a=e*(.35+Math.random()*.65)*(Math.random()<.12?1.7:1),i0=t*sr|0,pan=Math.random(),f1=o.lo+Math.random()*(o.hi-o.lo),d1=.008+Math.random()*.018;
  const M=[[f1,d1,1],[f1*(1.38+Math.random()*.25),d1*.6,.55],[f1*(2.1+Math.random()*.4),d1*.4,.25],[500+Math.random()*500,.018,o.body||.3]];
  for(const[f,tau,g]of M){const w=2*Math.PI*f/sr,len=Math.min(n-i0,Math.floor(tau*6*sr)),k=Math.exp(-1/(tau*sr)),ph=Math.random()*6.28;let am=a*g;for(let j=0;j<len;j++){const v=am*Math.sin(w*j+ph);L[i0+j]+=v*(1.15-pan*.5);R[i0+j]+=v*(.65+pan*.5);am*=k}}}
 let pk=0;for(let i=0;i<n;i++){pk=Math.max(pk,Math.abs(L[i]),Math.abs(R[i]))}if(pk>0){const sc=(o.peak||.9)/pk;for(let i=0;i<n;i++){L[i]*=sc;R[i]*=sc}}return bf}
function playBuf(bf,ms,vol,lp){try{const t=actx.currentTime+ms/1000,s=actx.createBufferSource(),g=actx.createGain();s.buffer=bf;g.gain.value=vol;let x=s;if(lp){const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;f.Q.value=.7;x.connect(f);x=f}x.connect(g).connect(sfxOut());s.start(t)}catch(_){}}
function tick(ms,vol,lo=2600,hi=4600){const k='t'+lo;if(!CLB[k])CLB[k]=[0,1,2,3,4,5].map(()=>clatter(.12,{times:[.002],lo,hi,body:.25}));playBuf(CLB[k][Math.random()*6|0],ms,vol)}
function shuffleSnd(){if(!sOK())return;const P=G.push||[];
 if(!SBUF.push){sMotor(0,TRA/1000,.05);sThump(60,.3,90)}
 const st=P.length?Math.min(...P.map(p=>p.s)):600,en=P.length?Math.max(...P.map(p=>p.s+p.d+380)):2100,D=Math.max(.6,(en-st)/1000);
 if(SBUF.push){playSample(SBUF.push,Math.max(0,st-150),(en-st+250)/1000,.9,.35)}else{if(!CLB.push||Math.abs(CLB.pushD-D)>.25){CLB.pushD=D;CLB.push=clatter(D,{dens:260,lo:2300,hi:5200,body:.35,env:u=>Math.min(1,u*5)*Math.pow(1-u,.6)*(.7+.3*Math.sin(u*40))})}
 playBuf(CLB.push,st,.55);sSlide(st,D,.07,800);
 if(!CLB.mach)CLB.mach=clatter(4.7,{dens:110,lo:1600,hi:3600,body:.5,env:u=>Math.min(1,u*4)*Math.min(1,(1-u)*5)*(.75+.25*Math.sin(u*22))});
 playBuf(CLB.mach,st+250,.32,2200);}
 const R=TRA;if(SBUF.out){playSample(SBUF.out,R,3.2,.95,.2);return}sThump(R,.28,80);
 for(let t=R+320;t<R+2300;t+=92){tick(t+Math.random()*25,.22);if(Math.random()<.5)tick(t+40+Math.random()*20,.12,3200,5200)}

function playSlice(bf,ms,off,dur,vol,pan){try{const t=actx.currentTime+ms/1000,s=actx.createBufferSource(),g=actx.createGain();s.buffer=bf;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.setValueAtTime(vol,t+dur*.45);g.gain.exponentialRampToValueAtTime(.001,t+dur);let x=s.connect(g);if(actx.createStereoPanner){const p=actx.createStereoPanner();p.pan.value=pan;x=x.connect(p)}x.connect(sfxOut());s.start(t,off,dur+.02)}catch(_){}}

function homeName(v){$('#name').value=v;lss('mj_name',v)}
function homeRoom(v){v=(v||'').replace(/[^A-Za-z0-9]/g,'')||'table1';$('#hRoom').value=v;if(v!==room){$('#room').value=v;join()}}
function homeCfg(o){if(!S||S.phase!=='lobby')return;const b=Math.max(0,Math.round(+$('#hBase').value)||0),t=Math.max(0,Math.round(+$('#hTai').value)||0);S.cfg=Object.assign({},S.cfg,{base:b,tai:t},o||{});save();render()}
function homeGo(play){if(!S||S.phase!=='lobby')return;homeName($('#hName').value.trim());homeCfg();if(me()<0){const i=S.seats.findIndex(x=>!x);if(i<0){$('#hNote').textContent='這桌已經坐滿了，換個房號吧';return}sit(i)}
 if(play){fillBots();S.score=[0,0,0,0];S.rw=0;S.rc=0;S.dealer=0;S.streak=0;start()}}
function matchEnds(){return !!S.win&&!S.win.draw&&S.win.seat!==S.dealer&&S.dealer===3&&((S.rc??S.rw??0)+1)>=matchLen()}
function finBox(){const N=i=>S.seats[i]?esc(S.seats[i].name):'';const o=[0,1,2,3].sort((a,b)=>S.score[b]-S.score[a]);return `<div class="fin"><b>🏆 ${matchLen()===1?'一圈':'一將'}結束</b><ol>${o.map((i,k)=>`<li><span>${['🥇','🥈','🥉','4.'][k]} ${N(i)}</span><span>${S.score[i]>0?'+':''}${S.score[i]}</span></li>`).join('')}</ol></div>`}
function newMatch(){if(S.phase!=='over')return;S.score=[0,0,0,0];S.rw=0;S.rc=0;S.dealer=0;S.streak=0;start()}
function inviteText(){return `🀄 麻將戰鬥邀請！來打麻將～\n房號：${room}\n\n加入方式：\n1. 打開這個網址：${location.origin+location.pathname}\n2. 在開始畫面「房號」輸入：${room}\n3. 按「進入牌桌，等朋友加入」`}
function invMsg(t){let e=$('#invT');if(!e){e=document.createElement('div');e.id='invT';e.className='invt';document.body.append(e)}e.textContent=t;e.hidden=false;clearTimeout(G.invTm);G.invTm=setTimeout(()=>e.hidden=true,2600)}
function invBox(t){let e=$('#invB');if(!e){e=document.createElement('div');e.id='invB';e.className='invb';e.innerHTML='<div><b>長按或全選複製這段文字</b><textarea readonly></textarea><button type="button" onclick="this.closest(\'.invb\').hidden=true">關閉</button></div>';document.body.append(e)}e.querySelector('textarea').value=t;e.hidden=false;const ta=e.querySelector('textarea');ta.focus();ta.select()}
function copyInvite(){const t=inviteText(),ok=()=>invMsg('✅ 已複製邀請，貼到 LINE 給朋友吧！');
 const legacy=()=>{try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(ta);ta.select();ta.setSelectionRange(0,t.length);const r=document.execCommand('copy');ta.remove();if(r)ok();else invBox(t)}catch(_){invBox(t)}};
 try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,legacy);else legacy()}catch(_){legacy()}}
function peek(){G.peek=1;render()}
(async()=>{init3d();try{db=await claude.use('db')}catch(e){db=null}
 if(!db){$('#app').innerHTML='<div style="padding:24px;font-size:16px;line-height:1.7"><b>還沒設定好連線</b><br>請把 Firebase 的設定貼到 firebase-config.js（照說明文件第 1 部分）。</div>';return}
 drawProf();chatInit();join()})();
</script></body></html>
